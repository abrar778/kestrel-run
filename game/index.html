<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kestrel Run — a ridge-running flight rally</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #6fb7ef; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; }
  #game canvas { display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<div id="game" aria-label="Kestrel Run: fly the little prop plane through the rings and land on the runway"></div>
<p id="status" role="status" aria-live="polite"></p>
<script src="./vendor/phaser.min.js"></script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
